{% extends "base.html" %}
{% block title %}Register | SocialIntel AI{% endblock %}

{% block content %}
<main class="auth-shell">
    <section class="auth-card glass-panel">
        <a href="/" class="auth-brand"><i class="bi bi-activity"></i> SocialIntel AI</a>
        <h1>Create account</h1>
        <p>Start analyzing social media CSV data in a professional dashboard.</p>
        <form method="post" class="mt-4">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Your name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">Register</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </section>
</main>
{% endblock %}
