{% extends "base.html" %}
{% block title %}Login | SocialIntel AI{% endblock %}

{% block content %}
<main class="auth-shell">
    <section class="auth-card glass-panel">
        <a href="/" class="auth-brand"><i class="bi bi-activity"></i> SocialIntel AI</a>
        <h1>Welcome back</h1>
        <p>Sign in to open your intelligence dashboard.</p>
        <form method="post" class="mt-4">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">Login</button>
        </form>
        <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
    </section>
</main>
{% endblock %}
